services:
  db:
    image: postgres:17
    restart: always

    volumes:
      - ../data/db:/var/lib/postgresql/data

    ports:
      - 5432:5432 #default port

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080 #default port
